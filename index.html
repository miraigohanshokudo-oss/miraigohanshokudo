    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#FF8C42', dark: '#E8702A', soft: '#FFE3CC' },
                        cream: { DEFAULT: '#FFF8EE', deep: '#FCEBD5' },
                        ink: { DEFAULT: '#3B2F2A', soft: '#6B5B52' },

                    },

    <!-- Google Fonts：本文は現行の Zen Maru Gothic、手書き風のアクセントに Klee One を追加 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #FFF8EE;
            color: #3B2F2A;
            -webkit-font-smoothing: antialiased;
        }
        section[id] { scroll-margin-top: 88px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* ロゴがふんわり浮かぶ */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        /* ロゴの白い背景をページの色になじませる */
        .logo-blend { mix-blend-mode: multiply; }

        /* ランプの灯りがほんのり明滅 */
        @keyframes glow {
            0%, 100% { opacity: .55; }
            50% { opacity: .75; }
        }
        .lamp-glow { animation: glow 5s ease-in-out infinite; }

        @media (prefers-reduced-motion: reduce) {
            .animate-float, .lamp-glow, .animate-fade-in-up, .shooting-star { animation: none !important; }
            .animate-fade-in-up { opacity: 1; }
        }

        .glass-nav {
            background: rgba(255, 248, 238, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .card-hover { transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow .3s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 30px -12px rgba(59, 47, 42, 0.18); }

        /* 手描き風の下線 */
        .hand-underline {
            background-image: linear-gradient(transparent 62%, rgba(255, 217, 122, .8) 62%, rgba(255, 217, 122, .8) 90%, transparent 90%);
        }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] .faq-chevron { transform: rotate(180deg); }

        /* 流れ星（現行の支援者ページの演出を継承） */
        @keyframes shooting-star {
            0% { transform: translateX(0) translateY(0) rotate(-45deg) scale(0); opacity: 0; }
            5% { transform: translateX(-50px) translateY(50px) rotate(-45deg) scale(1); opacity: 0.8; }
            15% { transform: translateX(-150px) translateY(150px) rotate(-45deg) scale(1); opacity: 0; }
            100% { transform: translateX(-300px) translateY(300px) rotate(-45deg) scale(0); opacity: 0; }
        }
        .shooting-star-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .shooting-star {
            position: absolute; height: 2px;
            background: linear-gradient(-45deg, rgba(251, 146, 60, 1), rgba(251, 146, 60, 0));
            filter: drop-shadow(0 0 6px rgba(251, 146, 60, 0.8));
            animation: shooting-star 12s ease-in-out infinite; opacity: 0;
        }
        .shooting-star:nth-child(1) { top: 5%; right: 10%; width: 100px; animation-delay: 0s; animation-duration: 8s; }
        .shooting-star:nth-child(2) { top: 20%; right: 30%; width: 130px; animation-delay: 3s; animation-duration: 10s; }
        .shooting-star:nth-child(3) { top: 35%; right: 5%; width: 80px; animation-delay: 1.5s; animation-duration: 7s; }
        .shooting-star:nth-child(4) { top: 50%; right: 20%; width: 110px; animation-delay: 5s; animation-duration: 11s; }
        .shooting-star:nth-child(5) { top: 65%; right: 35%; width: 120px; animation-delay: 7s; animation-duration: 9s; }
        .shooting-star:nth-child(6) { top: 80%; right: 15%; width: 90px; animation-delay: 2.5s; animation-duration: 10s; }

        /* 写真タイル（ある日の、みらいごはん） */
        .photo-tile { position: relative; border-radius: 1.75rem; overflow: hidden; margin: 0; }
        .photo-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
        .photo-tile:hover img { transform: scale(1.05); }
        .photo-tile figcaption { position: absolute; left: 12px; bottom: 12px; right: 12px; display: inline-flex; align-items: center; gap: 8px;
            width: fit-content; max-width: calc(100% - 24px); background: rgba(255,255,255,.95); border-radius: 999px; padding: 6px 14px 6px 6px; font-weight: 700; font-size: 13px; line-height: 1.4; }
        .photo-tile .step { flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; background: #FF8C42; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
        @media (prefers-reduced-motion: reduce) { .photo-tile img, .card-hover { transition: none; } }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ▼ 本番に反映するときは "" にする（このプレビューでは Miraigohan/ フォルダの画像を参照している）
        const ASSET = "";
        // 活動写真（本番では Miraigohan/img/ に置く想定。パスはそのまま使える）
        const PHOTO = "img/";

        // 現行サイトと同じ Google スプレッドシート（支援者一覧）
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuejf_70rGhnlDbFuv6c2z0qhKxWiH56PaC3F1HEwIO1ADEop_YwaezbCOmgfwFlM9_XhXM6WbIoct/pub?gid=1879743093&single=true&output=csv";

        const LINKS = {
            line: "https://line.me/ti/g2/XtKt8VAP887JrKY9S0ERs1GesUh3lb5yctO5XA",
            instagram: "https://www.instagram.com/miraigohanshokudo/",
            supportForm: "https://forms.gle/NvexjN3tXw6Unm6G6",
            note: "https://note.com/mraigohan_",
            suzuri: "https://suzuri.jp/miraigohan",
            furusato: "https://kodomo-furusato.com/recipients/projects/d024-mirai-gohan-shokudo", // こどもふるさと便 みらいごはん食堂のクラウドファンディングページ
            map: "https://www.google.com/maps/search/?api=1&query=ケアハウスあいおい苑+防府市佐野152-1",
        };

        // --- Icons (Lucide style) ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
                calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><path d="M16 2v4M8 2v4M3 10h18" /></>,
                clock: <><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></>,
                "map-pin": <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>,
                award: <><circle cx="12" cy="8" r="7" /><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12" /></>,
                "shopping-bag": <><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /></>,
                user: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
                users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></>,
                utensils: <><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></>,
                "message-circle": <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />,
                instagram: <><rect width="20" height="20" x="2" y="2" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" x2="17.51" y1="6.5" y2="6.5" /></>,
                "chevron-right": <path d="m9 18 6-6-6-6" />,
                "chevron-down": <path d="m6 9 6 6 6-6" />,
                leaf: <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />,
                sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z" />,
                home: <><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></>,
                building: <><rect x="4" y="2" width="16" height="20" rx="2" /><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01" /></>,
                gift: <><rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" /><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5" /></>,
                pencil: <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
                    {icons[name] || null}
                </svg>
            );
        };

        // --- 見出し（英字ラベル＋手書き風サブ） ---
        const SectionTitle = ({ label, title, lead, center = true }) => (
            <div className={`space-y-3 mb-10 ${center ? 'text-center' : ''}`}>
                <p className="font-hand text-brand text-lg">{label}</p>
                <h2 className="text-3xl md:text-4xl font-black text-ink leading-snug">{title}</h2>
                {lead && <p className={`text-ink-soft leading-relaxed ${center ? 'max-w-xl mx-auto' : ''}`}>{lead}</p>}
            </div>
        );

        // --- Instagram（Curator）---
        const InstagramFeed = () => {
            useEffect(() => {
                const scriptId = 'curator-script';
                if (document.getElementById(scriptId)) return;
                const script = document.createElement('script');
                script.id = scriptId;
                script.src = "https://cdn.curator.io/published/48187e1c-ab82-4549-87a1-e480e83d24ae.js";
                script.async = true;
                script.charset = "UTF-8";
                document.body.appendChild(script);
            }, []);
            return (
                <div className="bg-white rounded-[2rem] p-4 md:p-8 border border-cream-deep">
                    <div id="curator-feed-default-feed-layout">
                        <a href="https://curator.io" target="_blank" rel="noopener noreferrer" className="crt-logo crt-tag">Powered by Curator.io</a>
                    </div>
                </div>
            );
        };

        // --- 支援者一覧（データ処理は現行と同じ） ---
        const SupporterLink = ({ item, className }) => item.link
            ? <a href={item.link} target="_blank" rel="noopener noreferrer" className={`${className} hover:text-brand underline decoration-brand/40 underline-offset-4`}>{item.name}</a>
            : <span className={className}>{item.name}</span>;

        // 支援者の皆様（現行サイトと同じ3段階：特別／ちょっといい／通常）
        const SupportersSection = ({ data, loading }) => {
            const sponsorCount = data.special.platinum.length + data.special.gold.length + data.special.silver.length;
            const moneyCount = data.donations.platinum.length + data.donations.gold.length + data.donations.silver.length;
            const emptyText = loading ? "読み込み中です…" : "現在、表示する情報がありません。";
            return (
                <div className="relative">
                    <div className="shooting-star-container">
                        {[...Array(6)].map((_, i) => <div key={i} className="shooting-star"></div>)}
                    </div>
                    <div className="relative z-10 space-y-8">
                        {/* ご協賛・ご支援 */}
                        <div className="bg-white/90 backdrop-blur-sm rounded-[2.5rem] p-8 md:p-12 border-2 border-lamp/60 text-center shadow-xl shadow-orange-100/60">
                            <p className="inline-flex items-center gap-2 bg-lamp/40 px-5 py-2 rounded-full font-bold mb-8">
                                <Icon name="award" size={18} className="text-brand-dark" />ご協賛・ご支援（順不同）
                            </p>
                            {sponsorCount === 0 ? <p className="text-ink-soft">{emptyText}</p> : (
                                <div className="space-y-5">
                                    {data.special.platinum.length > 0 && (
                                        <div className="flex flex-wrap justify-center gap-4">
                                            {data.special.platinum.map((item, i) => <div key={i} className="bg-gradient-to-br from-lamp/50 to-white border-4 border-lamp px-8 py-5 rounded-2xl"><SupporterLink item={item} className="font-black text-2xl md:text-3xl tracking-wider" /></div>)}
                                        </div>
                                    )}
                                    {data.special.gold.length > 0 && (
                                        <div className="flex flex-wrap justify-center gap-4">
                                            {data.special.gold.map((item, i) => <div key={i} className="bg-gradient-to-br from-lamp/20 to-white border-4 border-lamp/50 px-6 py-4 rounded-2xl"><SupporterLink item={item} className="font-bold text-xl" /></div>)}
                                        </div>
                                    )}
                                    {data.special.silver.length > 0 && (
                                        <div className="flex flex-wrap justify-center gap-3">
                                            {data.special.silver.map((item, i) => <div key={i} className="bg-white border border-cream-deep px-5 py-3 rounded-2xl"><SupporterLink item={item} className="font-medium" /></div>)}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="grid md:grid-cols-2 gap-6 md:gap-8 items-start">
                            {/* 食材のご寄付 */}
                            <div className="bg-white rounded-[2rem] p-8 border-2 border-leaf-soft">
                                <p className="font-black text-xl flex items-center gap-3 mb-6">
                                    <span className="bg-leaf-soft text-leaf p-3 rounded-2xl"><Icon name="leaf" size={22} /></span>食材のご寄付（順不同）
                                </p>
                                <ul className="space-y-3">
                                    {data.food.length > 0 ? data.food.map((item, i) => (
                                        <li key={i} className="flex items-center gap-3 border-b border-dashed border-cream-deep pb-2 last:border-0">
                                            <span className="w-1.5 h-1.5 rounded-full bg-leaf shrink-0"></span><SupporterLink item={item} className="" />
                                        </li>
                                    )) : <li className="text-sm text-ink-soft">{emptyText}</li>}
                                </ul>
                            </div>
                            {/* 活動資金・ご寄付 */}
                            <div className="bg-white rounded-[2rem] p-8 border-2 border-brand-soft">
                                <p className="font-black text-xl flex items-center gap-3 mb-6">
                                    <span className="bg-brand-soft text-brand-dark p-3 rounded-2xl"><Icon name="heart" size={22} /></span>活動資金・ご寄付（順不同）
                                </p>
                                <ul className="space-y-3">
                                    {data.donations.platinum.map((item, i) => (
                                        <li key={`p${i}`} className="flex items-center gap-3 border-b border-dashed border-cream-deep pb-3">
                                            <span className="w-2.5 h-2.5 rounded-full bg-brand shrink-0"></span><SupporterLink item={item} className="font-black text-xl tracking-wider" />
                                        </li>
                                    ))}
                                    {data.donations.gold.map((item, i) => (
                                        <li key={`g${i}`} className="flex items-center gap-3 border-b border-dashed border-cream-deep pb-2">
                                            <span className="w-2 h-2 rounded-full bg-brand/70 shrink-0"></span><SupporterLink item={item} className="font-bold text-lg" />
                                        </li>
                                    ))}
                                    {data.donations.silver.map((item, i) => (
                                        <li key={`s${i}`} className="flex items-center gap-3 border-b border-dashed border-cream-deep pb-2 last:border-0">
                                            <span className="w-1.5 h-1.5 rounded-full bg-brand/50 shrink-0"></span><SupporterLink item={item} className="" />
                                        </li>
                                    ))}
                                    {moneyCount === 0 && <li className="text-sm text-ink-soft">{emptyText}</li>}
                                </ul>
                            </div>
                        </div>

                        {/* 掲載ルール */}
                        <details className="bg-white rounded-2xl border border-cream-deep p-6">
                            <summary className="cursor-pointer font-bold flex items-center justify-between">
                                <span>✨ 支援者ページへのお名前の掲載について</span>
                                <Icon name="chevron-down" size={20} className="faq-chevron transition-transform" />
                            </summary>
                            <p className="text-sm text-ink-soft mt-4">ご寄付・ご支援をいただいた皆様のお名前を本ページに掲載させていただきます。</p>
                            <ul className="text-sm text-ink-soft list-disc pl-5 space-y-1 mt-2">
                                <li><strong>金銭のご寄付（5万円未満）</strong>：掲載期間 1年間</li>
                                <li><strong>金銭のご寄付（5万円以上）</strong>：掲載期間 3年間</li>
                                <li><strong>物資のご寄付（単発）</strong>：掲載期間 半年間</li>
                                <li><strong>物資のご寄付（継続）</strong>：継続してご提供いただいている期間</li>
                                <li>お名前の公開（希望される掲載名）、リンク先URLの有無などを選ぶことができます。</li>
                            </ul>
                        </details>

                        {/* 助成金 */}
                        <div className="text-center space-y-4 pt-2">
                            <p className="inline-flex items-center gap-2 bg-brand-soft/70 px-5 py-2 rounded-full font-bold"><Icon name="sparkles" size={18} className="text-brand-dark" />助成金・ご支援プログラム</p>
                            <p className="text-sm text-ink-soft">みらいごはん食堂の活動を支えてくださる助成金・支援プログラムのご紹介です。</p>
                            <img src={`${ASSET}famima_sns_banner_1201-2.jpg`} alt="ファミリーマート 助成金バナー" className="mx-auto w-full max-w-sm rounded-2xl border border-cream-deep" />
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [supportersData, setSupportersData] = useState({ special: { platinum: [], gold: [], silver: [] }, food: [], donations: { platinum: [], gold: [], silver: [] } });
            const [menuOpen, setMenuOpen] = useState(false);
            const [loading, setLoading] = useState(true);

            // 支援者データの読み込み（現行サイトと同じロジック）
            useEffect(() => {
                fetch(GOOGLE_SHEET_CSV_URL)
                    .then(res => res.text())
                    .then(text => {
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
                        const next = { special: { platinum: [], gold: [], silver: [] }, food: [], donations: { platinum: [], gold: [], silver: [] } };
                        const today = new Date(); today.setHours(0, 0, 0, 0);
                        for (let i = 1; i < lines.length; i++) {
                            const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"(.*)"$/, '$1').trim());
                            if (cols.length < 2) continue;
                            const endVal = cols[4] ? cols[4].trim() : "";
                            if (endVal) {
                                const endDate = new Date(endVal.replace(/\//g, '-'));
                                if (!isNaN(endDate.getTime())) { endDate.setHours(0, 0, 0, 0); if (today > endDate) continue; }
                            }
                            const name = cols[0] ? cols[0].trim() : "";
                            const category = cols[1] ? cols[1].toLowerCase().trim() : "";
                            const link = cols[3] ? cols[3].trim() : "";
                            if (!category || !name) continue;
                            if (category.includes('activity') || category.includes('活動')) continue;
                            else if (category.includes('特別寄付')) next.donations.platinum.push({ name, link });
                            else if (category.includes('ちょっといい寄付')) next.donations.gold.push({ name, link });
                            else if (category.includes('通常寄付')) next.donations.silver.push({ name, link });
                            else if (category.includes('food') || category.includes('食材')) next.food.push({ name, link });
                            else if (category.includes('特別協賛') || category.includes('特別') || category.includes('special')) next.special.platinum.push({ name, link });
                            else if (category.includes('ちょっといい協賛')) next.special.gold.push({ name, link });
                            else if (category.includes('通常協賛') || category.includes('継続')) next.special.silver.push({ name, link });
                            else if (category.includes('donation') || category.includes('寄付')) next.donations.silver.push({ name, link });
                        }

                        setLoading(false);
                    })
